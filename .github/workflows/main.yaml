name: Test

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

on:
    workflow_dispatch:
    pull_request:
        branches: ["main"]
        types: [opened, synchronize, reopened, ready_for_review]

jobs:
    # Spell check is advisory: failures are reported as warnings and never fail
    # the workflow. Job-level `continue-on-error` is not allowed on reusable
    # workflow calls, so the steps are inlined with step-level tolerance.
    spell-check:
        runs-on: ubuntu-latest

        steps:
            - name: 📚 Git Checkout
              uses: actions/checkout@v4

            - name: 🪄 Spell Check
              uses: streetsidesoftware/cspell-action@v9
              continue-on-error: true
              with:
                  config: .github/cspell.json
                  files: "*.md"
                  incremental_files_only: true

            - name: 🪄 Spell Check PR Title
              if: github.event_name == 'pull_request'
              continue-on-error: true
              env:
                  PR_TITLE: ${{ github.event.pull_request.title }}
              run: |
                  echo "$PR_TITLE" \
                    | npx --yes cspell@9 stdin --config .github/cspell.json --no-progress --no-summary

    test:
        runs-on: ubuntu-latest

        if: github.event.pull_request.draft == false

        steps:
            - name: 📚 Git Checkout
              uses: actions/checkout@v4

            - uses: subosito/flutter-action@v2

            - name: Build and Test Core
              working-directory: packages/lite_ref_core
              run: |
                  flutter pub get
                  flutter analyze
                  flutter test --coverage

            - name: Build and Test Flutter
              working-directory: packages/lite_ref
              run: |
                  flutter pub get
                  flutter analyze
                  flutter test --coverage

            - name: Upload coverage reports to Codecov
              uses: codecov/codecov-action@v4
              env:
                  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
              with:
                  files: ./packages/lite_ref/coverage/lcov.info
                  flags: unittests
